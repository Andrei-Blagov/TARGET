# Локальная разработка (build из исходников + hot reload).
# Запуск: docker compose -f docker-compose.dev.yml up --build
services:
  backend:
    build:
      context: .
      dockerfile: Backend-Dockerfile
    container_name: target-backend-dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    # Для локалки оставляем --reload; в production Dockerfile его нет
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - target-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: target-frontend-dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend
    networks:
      - target-net

networks:
  target-net:
    name: target-net
    driver: bridge
